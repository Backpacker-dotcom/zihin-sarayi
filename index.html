{l:'A1',t:'"to be" — olmak',f:'Özne + am / is / are + X',n:'Türkçedeki -im, -sin, -dir eki İngilizcede ayrı bir kelimedir. I→am, he/she/it→is, diğerleri→are.',e:[['I am a teacher.','Ben öğretmenim.'],['She is happy.','O mutlu.'],['They are at home.','Onlar evde.']]},
{l:'A1',t:'"to be" — olumsuz ve soru',f:'Özne + am/is/are + not + X  ·  Am/Is/Are + Özne + X ?',n:'Olumsuzda "not" eklenir. Soruda iki terim yer değiştirir: fiil başa geçer.',e:[['He is not tired.','O yorgun değil.'],['Are you ready?','Hazır mısın?'],['Is it cold today?','Bugün hava soğuk mu?']]},
{l:'A1',t:'Present Simple — geniş zaman (+)',f:'Özne + V1   (he/she/it → V1 + s)',n:'Alışkanlıklar ve genel doğrular. Tek kural: üçüncü tekil kişide fiile -s gelir.',e:[['I drink tea every morning.','Her sabah çay içerim.'],['She works in a hotel.','O bir otelde çalışır.'],['We live in Turkey.','Türkiye\'de yaşıyoruz.']]},
{l:'A1',t:'Present Simple — olumsuz ve soru',f:'Özne + do/does + not + V1  ·  Do/Does + Özne + V1 ?',n:'"does" geldiğinde -s ekini o taşır, fiil yalın kalır: does + V1.',e:[['I do not eat meat.','Et yemem.'],['Does he speak English?','O İngilizce konuşur mu?'],['They do not work on Sunday.','Pazar günü çalışmazlar.']]},
{l:'A1',t:'Present Continuous — şimdiki zaman',f:'Özne + am/is/are + V-ing',n:'Şu anda süren eylem. "to be" formülüne V-ing eklenmiş hâli.',e:[['I am reading a book now.','Şu an kitap okuyorum.'],['She is cooking dinner.','O akşam yemeği pişiriyor.'],['Are you listening?','Dinliyor musun?']]},
{l:'A1',t:'there is / there are — var',f:'There is/are + isim + yer',n:'Tekil → is, çoğul → are. Türkçedeki "var" cümlesinin karşılığı.',e:[['There is a book on the table.','Masada bir kitap var.'],['There are two cats in the room.','Odada iki kedi var.'],['Is there a shop near here?','Buraya yakın bir dükkan var mı?']]},
{l:'A1',t:'can — yapabilmek',f:'Özne + can / cannot + V1',n:'"can" tüm öznelerde aynıdır, -s almaz. Ardından fiil hep yalın gelir.',e:[['I can swim.','Yüzebilirim.'],['She cannot drive.','O araba süremez.'],['Can you help me?','Bana yardım edebilir misin?']]},
{l:'A1',t:'İyelik — my, your, his, her',f:'my / your / his / her / our / their + isim',n:'Türkçede ek (-im, -in), İngilizcede ismin önüne gelen ayrı kelime.',e:[['This is my car.','Bu benim arabam.'],['Her name is Anna.','Onun adı Anna.'],['Where is your phone?','Telefonun nerede?']]},
{l:'A1',t:'Wh- soruları',f:'Wh + yardımcı fiil + Özne + V1 ?',n:'Soru formülünün başına soru kelimesi eklenir: Wh + (soru cümlesi).',e:[['Where do you live?','Nerede yaşıyorsun?'],['What does she want?','O ne istiyor?'],['Why are you sad?','Neden üzgünsün?']]},
{l:'A2',t:'Past Simple — geçmiş zaman (+)',f:'Özne + V2',n:'Düzenli fiiller: V1 + ed. Düzensizler ezberlenir (go→went, buy→bought).',e:[['I visited my mother yesterday.','Dün annemi ziyaret ettim.'],['She bought a new car.','Yeni bir araba aldı.'],['We went to the beach.','Plaja gittik.']]},
{l:'A2',t:'Past Simple — olumsuz ve soru',f:'Özne + did not + V1  ·  Did + Özne + V1 ?',n:'"did" geçmiş zamanı taşır; fiil V1\'e geri döner. did + V2 asla olmaz.',e:[['I did not see him.','Onu görmedim.'],['Did you finish the book?','Kitabı bitirdin mi?'],['They did not come to the party.','Partiye gelmediler.']]},
{l:'A2',t:'will — gelecek zaman',f:'Özne + will (not) + V1',n:'Anlık karar, tahmin, söz verme. Tüm öznelerde aynı.',e:[['I will call you tomorrow.','Seni yarın arayacağım.'],['It will rain tonight.','Bu gece yağmur yağacak.'],['She will not forget this.','Bunu unutmayacak.']]},
{l:'A2',t:'be going to — planlı gelecek',f:'Özne + am/is/are + going to + V1',n:'Önceden verilmiş karar ve planlar için.',e:[['I am going to learn English.','İngilizce öğreneceğim.'],['We are going to travel next week.','Gelecek hafta seyahat edeceğiz.'],['Is he going to sell his car?','Arabasını satacak mı?']]},
{l:'A2',t:'Karşılaştırma',f:'A + is + sıfat-er / more + sıfat + than + B',n:'Kısa sıfat → -er, uzun sıfat → more. Matematikteki A > B ilişkisi.',e:[['My house is bigger than your house.','Benim evim senin evinden büyük.'],['This book is more interesting than that film.','Bu kitap şu filmden daha ilginç.'],['Tea is cheaper than coffee.','Çay kahveden ucuz.']]},
{l:'A2',t:'En üstünlük',f:'the + sıfat-est  /  the most + sıfat',n:'Kümenin maksimumu: max(A, B, C…). Her zaman "the" ile.',e:[['This is the best restaurant in the city.','Bu şehirdeki en iyi restoran.'],['She is the youngest student.','O en genç öğrenci.'],['It was the most difficult question.','En zor soruydu.']]},
{l:'A2',t:'Past Continuous',f:'Özne + was/were + V-ing',n:'Geçmişte bir anda sürmekte olan eylem. I/he/she/it → was, diğerleri → were.',e:[['I was sleeping at ten.','Saat onda uyuyordum.'],['They were watching a film.','Film izliyorlardı.'],['She was cooking when I arrived.','Ben vardığımda yemek pişiriyordu.']]},
{l:'A2',t:'must · have to · should',f:'Özne + must / have to / should + V1',n:'must: güçlü zorunluluk · have to: dış zorunluluk · should: tavsiye.',e:[['You must be careful.','Dikkatli olmalısın.'],['I have to work tomorrow.','Yarın çalışmak zorundayım.'],['You should sleep early.','Erken uyumalısın.']]},
{l:'A2',t:'some · any · much · many',f:'some/any + isim  ·  much + sayılamaz  ·  many + sayılabilir',n:'Olumlu → some. Soru ve olumsuz → any.',e:[['I have some money.','Biraz param var.'],['Do you have any questions?','Hiç sorun var mı?'],['There is not much time.','Fazla zaman yok.']]},
{l:'B1',t:'Present Perfect',f:'Özne + have/has + V3',n:'Geçmişle şimdi arasındaki köprü: deneyim ya da sonucu hâlâ süren eylem.',e:[['I have finished my work.','İşimi bitirdim.'],['She has never visited London.','Londra\'yı hiç ziyaret etmedi.'],['Have you ever eaten sushi?','Hiç suşi yedin mi?']]},
{l:'B1',t:'Present Perfect + for / since',f:'have/has + V3 + for (süre) / since (başlangıç noktası)',n:'for = aralığın uzunluğu, since = aralığın başlangıç noktası.',e:[['I have lived here for ten years.','On yıldır burada yaşıyorum.'],['He has worked here since 2020.','2020\'den beri burada çalışıyor.'],['We have known each other for a long time.','Birbirimizi uzun zamandır tanıyoruz.']]},
{l:'B1',t:'Koşul cümlesi 1 — gerçek olasılık',f:'If + Present Simple , will + V1',n:'p ⇒ q : koşul gerçekleşirse sonuç da gerçekleşir. If tarafında will kullanılmaz.',e:[['If it rains, we will stay at home.','Yağmur yağarsa evde kalacağız.'],['If you study, you will pass the exam.','Çalışırsan sınavı geçersin.'],['If I see him, I will tell him.','Onu görürsem söyleyeceğim.']]},
{l:'B1',t:'Koşul cümlesi 2 — hayalî durum',f:'If + V2 , would + V1',n:'Şu an için gerçek dışı varsayım. Zaman bir basamak geri kayar.',e:[['If I had more time, I would travel more.','Daha çok zamanım olsaydı daha çok gezerdim.'],['If she knew the answer, she would tell us.','Cevabı bilseydi bize söylerdi.'],['What would you do if you won the lottery?','Piyangoyu kazansan ne yapardın?']]},
{l:'B1',t:'Edilgen yapı (Passive)',f:'Nesne + be + V3  (+ by …)',n:'Dönüşüm: etken cümlenin nesnesi başa geçer, fiil be + V3 olur.',e:[['The room is cleaned every day.','Oda her gün temizlenir.'],['This bridge was built in 1990.','Bu köprü 1990\'da inşa edildi.'],['The letter will be sent tomorrow.','Mektup yarın gönderilecek.']]},
{l:'B1',t:'Relative clause — ilgi cümlesi',f:'isim + who / which / that + cümle',n:'İnsan → who, nesne → which, ikisi için → that. İki cümleyi tek cümlede birleştirir.',e:[['The man who lives next door is a doctor.','Yan evde yaşayan adam doktor.'],['This is the book that I bought yesterday.','Bu, dün aldığım kitap.'],['I have a friend who speaks five languages.','Beş dil konuşan bir arkadaşım var.']]},
{l:'B1',t:'Gerund ve infinitive',f:'fiil + V-ing   |   fiil + to + V1',n:'enjoy, avoid, finish → V-ing · decide, want, hope → to V1.',e:[['I enjoy reading books.','Kitap okumaktan keyif alırım.'],['She decided to change her job.','İşini değiştirmeye karar verdi.'],['He avoids eating late.','Geç saatte yemekten kaçınır.']]},
{l:'B1',t:'used to — eskiden',f:'Özne + used to + V1',n:'Geçmişte olan ama artık olmayan alışkanlık ya da durum.',e:[['I used to live in Ankara.','Eskiden Ankara\'da yaşardım.'],['She used to drink a lot of coffee.','Eskiden çok kahve içerdi.'],['We did not use to travel much.','Eskiden pek seyahat etmezdik.']]},
{l:'B1',t:'Dolaylı anlatım',f:'Özne + said (that) + cümle (zaman bir basamak geri)',n:'Operatör: am/is → was · will → would · V2 → had V3.',e:[['She said that she was tired.','Yorgun olduğunu söyledi.'],['He told me that he would come.','Geleceğini söyledi.'],['They said that they had finished.','Bitirdiklerini söylediler.']]},
{l:'B2',t:'Past Perfect',f:'Özne + had + V3',n:'Geçmişin geçmişi: iki geçmiş olaydan önce olanı.',e:[['The train had left when we arrived.','Biz vardığımızda tren gitmişti.'],['I had never seen such a beautiful place.','Hiç bu kadar güzel bir yer görmemiştim.'],['She had already eaten before the meeting.','Toplantıdan önce çoktan yemişti.']]},
{l:'B2',t:'Koşul cümlesi 3 — geçmişe pişmanlık',f:'If + had + V3 , would have + V3',n:'Geçmişte olmamış bir koşul ve olmamış sonucu.',e:[['If I had known, I would have helped you.','Bilseydim sana yardım ederdim.'],['If she had studied, she would have passed.','Çalışsaydı geçerdi.'],['We would have arrived earlier if we had taken a taxi.','Taksiye binseydik daha erken varırdık.']]},
{l:'B2',t:'Present Perfect Continuous',f:'Özne + have/has + been + V-ing',n:'Geçmişte başlayıp hâlâ süren eylemin süresini vurgular.',e:[['I have been waiting for two hours.','İki saattir bekliyorum.'],['She has been working here since May.','Mayıstan beri burada çalışıyor.'],['How long have you been learning English?','Ne zamandır İngilizce öğreniyorsun?']]},
{l:'B2',t:'Geçmişe dair çıkarım',f:'must / might / cannot + have + V3',n:'Olasılık ölçeği: must ≈ %95 · might ≈ %50 · cannot ≈ %0.',e:[['He must have forgotten the meeting.','Toplantıyı unutmuş olmalı.'],['She might have missed the bus.','Otobüsü kaçırmış olabilir.'],['They cannot have finished already.','Çoktan bitirmiş olamazlar.']]},
{l:'B2',t:'wish — keşke',f:'Özne + wish + Özne + V2  /  had + V3',n:'Şimdi için dilek → V2 · geçmiş için pişmanlık → had V3.',e:[['I wish I had more free time.','Keşke daha çok boş zamanım olsa.'],['I wish I had studied harder.','Keşke daha çok çalışsaydım.'],['She wishes she lived near the sea.','Keşke deniz kenarında yaşasam diyor.']]},
{l:'B2',t:'Ettirgen yapı',f:'have / get + nesne + V3',n:'İşi sen yapmıyorsun, yaptırıyorsun.',e:[['I had my car repaired.','Arabamı tamir ettirdim.'],['She gets her hair cut every month.','Her ay saçını kestirir.'],['We are having the house painted.','Evi boyatıyoruz.']]},
{l:'C1',t:'Devrik yapı (Inversion)',f:'Olumsuz zarf + yardımcı fiil + Özne + fiil',n:'Never, rarely, not only başa gelince cümle soru dizilişine geçer. Vurgu ve resmiyet katar.',e:[['Never have I seen such a view.','Böyle bir manzarayı hiç görmedim.'],['Rarely does he speak in meetings.','Toplantılarda nadiren konuşur.'],['Not only did she win, but she also broke the record.','Sadece kazanmakla kalmadı, rekoru da kırdı.']]},
{l:'C1',t:'Vurgu cümleleri (Cleft)',f:'It is/was + X + that …   ·   What + cümle + is/was + X',n:'Cümlenin bir öğesini öne çekip spot ışığına alır.',e:[['It was the price that surprised me.','Beni şaşırtan fiyattı.'],['What I need is a long holiday.','İhtiyacım olan şey uzun bir tatil.'],['It is experience that makes the difference.','Farkı yaratan deneyimdir.']]},
{l:'C1',t:'Karışık koşul',f:'If + had + V3 , would + V1',n:'Geçmişteki koşulun bugünkü sonucu: Koşul 3 ile Koşul 2\'nin bileşimi.',e:[['If I had taken that job, I would be rich now.','O işi kabul etseydim şimdi zengin olurdum.'],['If she were more careful, she would not have made that mistake.','Daha dikkatli biri olsaydı o hatayı yapmazdı.'],['If we had left earlier, we would be there by now.','Daha erken çıksaydık şimdiye orada olurduk.']]},
{l:'C1',t:'Katılımcı yapılar (Participle)',f:'V-ing … / Having + V3 … , ana cümle',n:'İki cümleyi sıkıştırır; özne ortak olmak zorundadır.',e:[['Having finished the report, she went home.','Raporu bitirince eve gitti.'],['Walking along the beach, I found a ring.','Sahilde yürürken bir yüzük buldum.'],['Not knowing the answer, he stayed quiet.','Cevabı bilmediği için sessiz kaldı.']]},
{l:'C1',t:'Subjunctive — istek kipi',f:'suggest / insist / essential + that + Özne + V1 (yalın)',n:'Özne ne olursa olsun fiil yalın kalır: he take, she be.',e:[['I suggest that he take a break.','Mola vermesini öneririm.'],['They insisted that she be present.','Orada bulunmasında ısrar ettiler.'],['It is essential that everyone arrive on time.','Herkesin zamanında gelmesi şart.']]}
];

['mem','N köprüsü',`"a apple" derken ağzın iki sesli arasında tekler. <b>N</b>, iki sesliyi birbirine bağlayan köprüdür: an‿apple, an‿egg, an‿hour. Sesli sesle başlayan kelimenin önüne küçük bir köprü kurduğunu gör.`],

{id:'a1-4',l:'A1',t:'Çoğullar · this / that',s:'İki kitap neden "two books"',b:[
['p',`Türkçede sayıdan sonra isim tekil kalır: "iki kitap". İngilizcede birden fazla olan her şey <b>çoğul eki alır</b>: two book<b>s</b>, many car<b>s</b>, three room<b>s</b>.`],
['tbl',`Kural | Örnek
Çoğu kelime + s | book → books · car → cars
s, sh, ch, x, o ile bitiyorsa + es | bus → buses · box → boxes · watch → watches · tomato → tomatoes
sessiz + y → ies | city → cities · baby → babies
sesli + y → s | day → days · boy → boys
f / fe → ves | knife → knives · wife → wives · life → lives`],
['x','Düzensiz çoğullar',`one man, two men | bir adam, iki adam
one woman, two women | bir kadın, iki kadın (okunuşu: vimin)
one child, two children | bir çocuk, iki çocuk
one person, two people | bir kişi, iki kişi
one foot, two feet | bir ayak, iki ayak
one tooth, two teeth | bir diş, iki diş
one mouse, two mice | bir fare, iki fare
one fish, two fish | bir balık, iki balık`],
['mem','Kalabalıkta ezilen A',`Bir <b>MAN</b> kalabalığa girince A harfi ezilip E'ye döner: <b>MEN</b>. Aynısı woman → women. <b>OO → EE:</b> ayak (f<b>oo</b>t) ve diş (t<b>oo</b>th) çoğalınca şaşkınlıktan "iii!" diye bağırır: f<b>ee</b>t, t<b>ee</b>th. Tek bir ayağa bak "uu", iki ayağa bak "ii".`],
['h','this · that · these · those'],
['tbl',` | Yakın (dokunabildiğin) | Uzak (gösterdiğin)
Tekil | this | that
Çoğul | these | those`],
['x','',`This is my phone. | Bu benim telefonum.
That is your car. | Şu senin araban.
These are my keys. | Bunlar benim anahtarlarım.
Those are her children. | Şunlar onun çocukları.
This book is good. | Bu kitap iyi.
Those shoes are expensive. | Şu ayakkabılar pahalı.
Is this your bag? | Bu senin çantan mı?
What is that? | Şu ne?
Who are these people? | Bu insanlar kim?`],
['mem','Sesin uzunluğu = mesafe ve sayı',`<b>this</b>: kısa "i", elinin altında. <b>that</b>: "a" sesi, "taa orada". <b>these</b>: uzun "iii", çünkü birden çok. <b>those</b>: uzun "oo", uzaktaki çokluk. Kısa ses tekil, uzun ses çoğul.`],
['trap',`two book | two books | Sayıdan sonra da çoğul.
many car | many cars | many varsa isim çoğul.
childrens | children | Zaten çoğul, üstüne s gelmez.
peoples | people | people zaten çoğul: People are…
This are my keys. | These are my keys. | Çoğul isimle these.`],
['q',`gap | I have two ___ . (child) | children | Düzensiz çoğul.
gap | There are five ___ in the room. (woman) | women | man → men gibi.
gap | Three ___ (city) | cities | sessiz + y → ies.
gap | Two ___ (box) | boxes | x ile bitiyor: es.
mc | Yakındaki anahtarlar için? | This is my keys. / These are my keys. / Those is my keys. | 1 | Yakın + çoğul = these.
gap | My ___ are cold. (foot) | feet | oo → ee.
tr | Şu adam kim? | Who is that man | Uzak tekil: that.
mc | Hangisi doğru? | The peoples are happy. / The people are happy. / The people is happy. | 1 | people çoğuldur, are alır.`]]},

{id:'a1-5',l:'A1',t:'Zamirler ve sahiplik',s:'I · me · my · mine',b:[
['p',`Türkçedeki tek "o", İngilizcede üçe ayrılır: <b>he</b> (erkek), <b>she</b> (kadın), <b>it</b> (nesne, hayvan, durum). Konuşurken en çok karıştırılan yer burasıdır, çünkü Türkçe düşünürken bu ayrımı hiç yapmıyoruz.`],
['tbl',`Özne | Nesne | Sahiplik + isim | Tek başına
I | me | my | mine
you | you | your | yours
he | him | his | his
she | her | her | hers
it | it | its | —
we | us | our | ours
they | them | their | theirs`],
['p',`<b>Özne</b> zamiri fiilden önce durur. <b>Nesne</b> zamiri fiilden ya da edattan sonra gelir.`],
['x','Fiilin iki yanı',`I love her. | Onu seviyorum.
She loves me. | O beni seviyor.
We know them. | Onları tanıyoruz.
They know us. | Onlar bizi tanıyor.
Come with me. | Benimle gel.
This is for you. | Bu senin için.
Look at him. | Ona bak.
Tell her. | Ona söyle.`],
['x','Sahiplik',`My name is Ufuk. | Benim adım Ufuk.
Her husband is a doctor. | Onun kocası doktor.
His sister lives in Ankara. | Onun kız kardeşi Ankara'da yaşıyor.
Their house is big. | Onların evi büyük.
Our hotel is near the sea. | Otelimiz denize yakın.
The cat drinks its milk. | Kedi sütünü içiyor.
Is this your pen? — Yes, it is mine. | Bu senin kalemin mi? — Evet, benim.
Whose car is this? — It is his. | Bu kimin arabası? — Onun.`],
['p',`Kişi adıyla sahiplik <b>'s</b> ile kurulur ve sıra Türkçedeki gibidir: <b>Ali's car</b> = Ali'nin arabası, <b>my mother's house</b> = annemin evi.`],
['mem','Kapı',`Fiili bir <b>kapı</b> olarak düşün. Kapının önünde bekleyenler işi yapanlardır: I, he, she, we, they. Kapıdan geçip öbür tarafa düşenler kılık değiştirir: me, him, her, us, them. <b>He</b> ve <b>they</b> kapıdan geçerken bir <b>M</b> kapar: hi<b>m</b>, the<b>m</b>. M = "maruz kalan".`],
['mem','Sahibe bak',`his mi her mi? Sahip olunana değil <b>sahibe</b> bak. Ayşe'nin babası: sahip Ayşe (kadın) → <b>her</b> father. Ali'nin annesi: sahip Ali → <b>his</b> mother.`],
['trap',`I love he. | I love him. | Fiilden sonra nesne zamiri.
This is my brother. Her name is Ali. | His name is Ali. | Sahip erkek → his.
The car of Ali | Ali's car | Kişilerde 's kullanılır.
It's door is red. | Its door is red. | it's = it is · its = onun.
Me and Ali go to work. | Ali and I go to work. | Öznede I kullanılır, kibarca sona konur.`],
['q',`gap | I know ___ . (he) | him | Fiilden sonra nesne zamiri.
gap | She is my sister. ___ name is Elif. | her | Sahip kadın.
gap | Come with ___ . (we) | us | Edattan sonra nesne zamiri.
tr | Ali'nin arabası | Ali's car | Kişilerde 's.
mc | "Bu kalem benim." | This pen is my. / This pen is mine. / This pen is me. | 1 | İsim yoksa mine.
gap | They love ___ children. (they) | their | Sahiplik + isim.
tr | Onu seviyorum. (kadın) | I love her | Nesne zamiri: her.
mc | "The dog eats ___ food." | it's / its / his | 1 | its = onun; it's = it is.`]]},

{id:'a1-6',l:'A1',t:'Present Simple',s:'Her zaman, genelde, hep böyle',b:[
['p',`Alışkanlıklar, değişmeyen gerçekler, tarifeler ve kalıcı durumlar bu zamanla söylenir. Dikkat: Türkçede "-yor" dediğimiz birçok kalıcı durum İngilizcede bu zamandır. "Ayvalık'ta <u>yaşıyorum</u>" kalıcıdır → <b>I live in Ayvalık.</b>`],

['mem','Tek S kuralı',`Bir cümlede S <b>ya öznededir ya fiilde</b>. Özne çoğulsa S öznede durur, fiil yalın kalır: The boy<b>s</b> play. Özne tekilse S fiile geçer: The boy play<b>s</b>. İki S aynı anda olmaz, hiç S'siz de kalınmaz. (I, you, we, they bu oyunun dışındadır.)`],
['h','Sıklık zarfları'],
['tbl',`Zarf | Sıklık | Anlamı
always | %100 | her zaman

{id:'a1-7',l:'A1',t:'do · does',s:'Olumsuz ve soru kurmak',b:[
['p',`Türkçede olumsuzu <b>-me</b>, soruyu <b>-mi</b> eki yapar. İngilizcede bu işi ayrı bir yardımcı kelime yapar: <b>do</b> (he/she/it için <b>does</b>). Do'nun kendi anlamı yoktur; sadece olumsuzluk ve soru taşıyıcısıdır.`],
['f','Özne + do / does + not + V1          Do / Does + Özne + V1 ?'],
['p',`En kritik nokta: <b>does geldiğinde -s ekini o taşır</b>, asıl fiil yalın hâline döner. She work<b>s</b> → She <b>does</b> not work.`],
['x','Olumsuz',`I do not smoke. | Sigara içmem.

He doesn't know my name. | Adımı bilmiyor.
It doesn't matter. | Fark etmez.
They don't have children. | Çocukları yok.`],
['x','Evet / hayır sorusu ve kısa cevap',`Do you speak English? — Yes, I do. | İngilizce konuşur musun? — Evet.
Does she live here? — No, she doesn't. | Burada mı yaşıyor? — Hayır.
Do they have children? | Çocukları var mı?
Does this bus go to the airport? | Bu otobüs havalimanına gider mi?
Do you like fish? | Balık sever misin?`],
['x','Soru kelimesiyle',`Where do you work? | Nerede çalışıyorsun?
What does he do? | O ne iş yapıyor?
When does the film start? | Film ne zaman başlıyor?
How do you go to work? | İşe nasıl gidiyorsun?

What time does the shop close? | Dükkan kaçta kapanıyor?
How much does it cost? | Ne kadar tutuyor?
What does this word mean? | Bu kelime ne demek?`],
['mem','Does, S\'yi yutar',`<b>DOES</b>'u aç gözlü biri olarak hayal et: cümleye girdiği anda fiilin ucundaki S'yi koparıp kendi yutar (do<b>es</b>). Fiil artık çıplaktır: Does she work<s>s</s>? Cümlede does varsa fiilin sonuna bak, S kalmış mı?`],
['mem','KUAZM',`Soru sırası: <b>QU</b>estion word + <b>A</b>uxiliary + <b>S</b>ubject + <b>M</b>ain verb → QUASM, "kuazm" diye oku. Where | do | you | live? Her soru bu dört kutuya sırayla dolar.`],
['mem','Aynı odaya girmezler',`<b>be</b> ile <b>do</b> kavgalıdır, aynı cümlede bulunmazlar. Cümlede am / is / are varsa do çağrılmaz: Are you tired? (Do you are tired? ✗)`],
['trap',`Does she works here? | Does she work here? | S'yi does yuttu.

I no like fish. | I don't like fish. | Olumsuzluk do ile kurulur.
Do you are tired? | Are you tired? | be varsa do yok.
What means this word? | What does this word mean? | KUAZM sırası.
Where you work? | Where do you work? | Yardımcı fiil atlanmaz.`],
['q',`gap | She ___ not eat meat. | does | Tekil üçüncü kişi.
gap | ___ you speak English? | do | you → do.
gap | Where ___ he work? | does | he → does.

tr | Bu kelime ne demek? | What does this word mean | KUAZM.

{id:'a1-8',l:'A1',t:'İki ayrı "var"',s:'have · there is / there are',b:[

have a good time | iyi vakit geçirmek

['x','Bulunma: there is / there are',`There is a bank near here. | Buraya yakın bir banka var.

['mem','Cep testi',`"Var" dediğin şeyi <b>cebine ya da hayatına</b> koyabiliyor musun? Araba, kardeş, zaman, baş ağrısı senindir → <b>HAVE</b>. Bir yerde duruyorsa → <b>THERE</b>. Zaten <b>there</b> "orada" demektir: "Orada bir banka var" = There is a bank.`],
['trap',`In the room has a bed. | There is a bed in the room. | Yer sahip olamaz.
I have 38 years. | I am 38 years old. | Yaş be ile.
There is two cats. | There are two cats. | Çoğul → are.
I have hungry. | I am hungry. | Hâller be ile.
There have a problem. | There is a problem. | there + be.`],
['q',`mc | "Masada bir telefon var." | The table has a phone. / There is a phone on the table. / It has a phone on the table. | 1 | Bir yerde bulunma: there is.

{id:'a1-9',l:'A1',t:'in · on · at',s:'Yer ve zamanın hunisi',b:[
['p',`Türkçede tek bir <b>-de / -da</b> eki var. İngilizce aynı eki üçe böler ve seçim bir <b>geometri</b> sorusudur: nokta mı, yüzey mi, hacim mi?`],
['tbl',` | AT · nokta | ON · yüzey | IN · hacim
Yer | at the door · at the bus stop | on the table · on the wall | in the room · in the bag

['mem','Taşıt testi',`İçinde <b>ayağa kalkıp yürüyebiliyorsan ON</b>: on the bus, on the train, on the plane, on the ship. <b>Oturmak zorundaysan IN</b>: in the car, in the taxi.`],

{id:'h-1',l:'H',t:'Ses köprüsü',s:'Yabancı sesi tanıdık bir görüntüye bağlamak',b:[
['p',`Beyin soyut sesleri tutmaz, <b>görüntüleri</b> tutar. Ses köprüsü, yabancı kelimenin sesini Türkçede ona benzeyen bir kelimeye, o kelimeyi de anlamla tek bir sahnede birleştirir. Üç adım:`],

{id:'h-2',l:'H',t:'Hafıza sarayı',s:'İlk odanın rehberli turu',b:[
['p',`Antik Yunan ve Roma hatipleri saatlerce süren konuşmaları kâğıtsız ezberlerdi. Yöntemleri: iyi bildikleri bir binada sabit bir rota belirlemek ve hatırlanacak her şeyi rota üzerindeki bir durağa <b>görüntü olarak</b> bırakmak. Hatırlamak için binayı zihinde yeniden yürümek yeterlidir, çünkü <b>mekân hafızası</b> insanın en güçlü hafızasıdır.`],
['p',`Uygulamadaki her odanın <b>aynı on durağı</b> vardır ve sırası hiç değişmez: Kapı → Askılık → Ayna → Koltuk → Sehpa → Halı → Pencere → Kitaplık → Lamba → Masa. Bunları kendi evindeki gerçek bir odanın gerçek eşyalarıyla eşleştir.`],
['h','1. Oda: on kelimenin hazır sahnesi'],
['p',`Aşağıdaki turu yavaşça oku ve her durakta <b>gözünü kapatıp sahneyi gör</b>.`],
['tbl',`Durak | Kelime | Sahne
Kapı | I · ben | Kapının tam ortasında tavana kadar uzanan dev bir <b>I</b> sütunu var. Tepesinde <b>ay</b> parlıyor. Sütuna sarılıp "BEN!" diye bağırıyorsun.
Askılık | you · sen | Askılıkta bir <b>YUnus</b> asılı. Kuyruğunu çırpıp parmağıyla seni gösteriyor: "SEN!"
Ayna | he · o (erkek) | Aynaya bakıyorsun, karşında sen değil bıyıklı bir adam var, "Hİ Hİ Hİ" diye gülüyor.
Koltuk | she · o (kadın) | Koltukta bir kadın oturmuş, elinde dev bir <b>ŞİŞ</b> ile kazak örüyor.
Sehpa | it · o (nesne, hayvan) | Sehpanın üstünde bir <b>İT</b> oturuyor ve sana havlıyor. İnsan değil: it.
Halı | we · biz | Halı havalanıyor; hepiniz üstünde "<b>Vİİİ!</b>" diye bağırarak uçuyorsunuz. BİZ.
Pencere | they · onlar | Pencereden bakıyorsun: sokakta bir kalabalık "<b>DEY DEY</b>" diye halay çekiyor. ONLAR.
Kitaplık | this · bu | Kitapların arasından kocaman bir <b>DİŞ</b> çekip elinde tutuyorsun: "BU ne?"
Lamba | that · şu | Lambanın altında bir <b>DETektif</b> büyüteciyle uzağı gösteriyor: "ŞU!"
Masa | here · burada | Masanın ortasına bir <b>HIYAR</b> saplanmış, üstünde tabela: "BURADAYIM".`],
['mem','Turu üç kez yap',`<b>1)</b> Kapıdan masaya ileri doğru. <b>2)</b> Masadan kapıya <b>geriye</b> doğru; sıra bozulunca bile hatırlıyorsan yerleşmiştir. <b>3)</b> Rastgele: "Halıda ne vardı?" Sonra Saray sekmesinden 1. Oda'yı açıp kendini sına.`],
['mem','Kendi odalarını kurarken',`Soyut kelimeleri somutlaştır: "because" için bir <b>bıçak</b> ("bi-koz"), "always" için hiç durmayan bir <b>saat</b>. Bir durakta iki kelime tutma. Aynı sahneyi iki odada kullanma; her odanın rengi bunun için farklı.`],

['h','6 · -en ile bitenler'],
['x','Üçüncü hâl "n" sesiyle kapanır',`speak – spoke – spoken | konuşmak

  return out}

function hotelWords(i){return hl(HOTEL[i].w).map(r=>r.split(' | '))}
function hotelQs(idx,n){const S=[],W=[];idx.forEach(i=>{S.push(...hotelPairs(i));W.push(...hotelWords(i))});
  const out=[],nS=Math.round(n*.45),nO=Math.round(n*.25),nW=n-nS-nO;
  shuffle(S).slice(0,nS).forEach(p=>{const o=shuffle([p[0],...shuffle(S.filter(x=>x!==p)).slice(0,3).map(x=>x[0])]);out.push({k:'mc',q:`Misafire "${p[1]}" demek istiyorsun. Hangisi?`,o,a:o.indexOf(p[0]),w:p[0]})});

    else out.push({k:'gap',q:`"${p[1]}" İngilizcesi: ___`,a:[p[0]],w:`${p[1]} = ${p[0]}`})});
  return shuffle(out)}

  const sg=V.dseg||0,seg=`<h1 class="pt">Dersler</h1><div class="seg">${['Konu anlatımı','Hafıza Okulu','Özet kartlar'].map((n,i)=>`<button class="${i==sg?'on':''}" onclick="V.dseg=${i};render()">${n}</button>`).join('')}</div>`;

  case 'trap':return `<div class="box red"><small>TÜRKÇE DÜŞÜNMENİN TUZAĞI</small>${lines(b[1]).map(r=>{const t=r.split(' | ');return `<div class="trow"><s>✗ ${esc(t[0])}</s><b>✓ ${esc(t[1])}</b>${t[2]?`<p>${t[2]}</p>`:''}</div>`}).join('')}</div>`;
  case 'mem':return `<div class="box gold"><small>HAFIZA TEKNİĞİ · ${b[1]}</small>${b[2]}</div>`;
  case 'hints':return Object.entries(HINT).map(([w,h])=>{const W=WORDS.find(x=>x.w==w);return `<div class="ex"><div><b>${esc(w)} — ${esc(W?W.t:'')}</b><span>${esc(h)}</span></div>${spk(w)}</div>`}).join('');
  default:return ''}}
function parseQ(s){return lines(s).map(r=>{const p=r.split(' | ');return p[0]=='lis'?{k:'lis',q:'',a:[p[1]],w:p[2]}:p[0]=='mc'?{k:'mc',q:p[1],o:p[2].split(' / '),a:+p[3],w:p[4]}:{k:p[0],q:p[1],a:p[2].split(' / '),w:p[3]}})}
function openL(i){V.tab='gram';V.sess=null;V.g=null;V.ls={i,qi:-1};render();window.scrollTo(0,0)}
const PRAISE=['Harika!','Tam isabet!','İşte bu!','Mükemmel!','Çok iyi!','Aynen öyle!','Süpersin!'];
const hasTTS=()=>!!window.AndroidTTS||(!!window.speechSynthesis&&(VOICES.length>0||(loadV(),VOICES.length>0)));
function lSetup(){const l=V.ls,q=l.qs[l.qi];l.rev=false;l.sel=null;l.ans=null;if(q&&q.k=='ord'){l.tok=q.a[0].split(' ');l.pool=shuffle(l.tok.map((_,i)=>i));l.pick=[]}}
function lAuto(){const l=V.ls,q=l&&l.qs&&l.qs[l.qi];if(q&&q.k=='lis')say(q.a[0])}
function lStart(){const l=V.ls,L=LESSONS[l.i];l.qs=parseQ(L.b[L.b.length-1][1]);if(!hasTTS())l.qs=l.qs.filter(q=>q.k!='lis');l.n0=l.qs.length;l.qi=0;l.score=0;l.combo=0;l.gain=0;lSetup();render();window.scrollTo(0,0);lAuto()}
function lPick(i){const l=V.ls;if(l.rev)return;l.pick.push(i);if(l.pick.length==l.tok.length)return lAns();render()}
function lUn(k){const l=V.ls;if(l.rev)return;l.pick.splice(k,1);render()}
function lSkip(){const l=V.ls,q=l.qs[l.qi];if(!q.re)l.n0--;l.qs.splice(l.qi,1);if(l.qi>=l.qs.length)return lFinish();lSetup();render();lAuto()}
function lAns(k){const l=V.ls,q=l.qs[l.qi];if(l.rev)return;
  if(q.k=='mc'){l.sel=k;l.ok=k==q.a}
  else if(q.k=='ord'){l.ans=l.pick.map(i=>l.tok[i]).join(' ');l.ok=l.ans==q.a[0]}
  else{l.ans=document.getElementById('ans').value;l.ok=q.a.some(a=>normS(a)==normS(l.ans))}
  if(l.ok){if(!q.re)l.score++;l.combo++;const x=q.re?5:10;l.gain+=x;addXP(x);l.praise=PRAISE[rnd(PRAISE.length)]}else{l.combo=0;if(!q.re)l.qs.push(Object.assign({},q,{re:1}))}
  l.rev=true;render();const t=q.k=='mc'?q.o[q.a]:q.a[0];if(q.k=='mc'?(/[.?!]$/.test(t)&&!/[çğıöşüÇĞİÖŞÜ]/.test(t)):q.k!='gap')say(t)}
function lNext(){const l=V.ls;l.qi++;if(l.qi>=l.qs.length)return lFinish();lSetup();render();lAuto()}
function lFinish(){const l=V.ls,id=LESSONS[l.i].id;l.qi=l.qs.length;l.fin=true;S.ls[id]=Math.max(S.ls[id]||0,l.score);l.gain+=30;addXP(30);S.log[today()]=(S.log[today()]||0)+1;save();render();confetti()}
function vLesson(){const l=V.ls,L=LESSONS[l.i],back=`<button class="back" onclick="V.ls=null;render()">‹ Dersler</button>`;
  if(l.qi<0){const body=L.b.slice(0,-1).map(blk).join(''),n=lines(L.b[L.b.length-1][1]).length;
    return `<div class="bar">${back}<span class="grow">${L.l=='H'?'Hafıza Okulu':L.l}</span></div><h1 class="pt">${L.t}</h1><p class="lead">${L.s}</p><div class="lesson">${body}</div><button class="btn" onclick="lStart()">Alıştırmalara geç · ${n} soru →</button>`}
  const n=l.qs.length,top=`<div class="bar">${back}<div class="prog"><i style="width:${100*l.qi/Math.max(n,1)}%"></i></div><span>${l.combo>=3?'🔥 '+l.combo:''}</span></div>`;
  if(l.fin||l.qi>=n){const nx=l.i+1<LESSONS.length&&LESSONS[l.i+1].l==L.l,L2=lvl();
    return top+`<div class="card center"><div class="big">${l.score}/${l.n0}</div><h3>${l.score==l.n0?'Kusursuz! 🏆':l.score>=l.n0*.7?'Ders tamamlandı 🎉':'Bitti; bir kez daha okumaya değer'}</h3><p class="xpg">+${l.gain} XP</p><p>Unvanın: <b>${L2.name}</b>${L2.next?` · ${L2.next} olmaya ${L2.left} XP`:''}</p>
    ${nx?`<button class="btn" onclick="openL(${l.i+1})">Sonraki ders →</button>`:''}<button class="btn ghost" onclick="openL(${l.i})">Dersi yeniden aç</button><button class="btn ghost" onclick="V.ls=null;render()">Listeye dön</button></div>`}
  const q=l.qs[l.qi],lab={mc:'Doğru olanı seç',gap:'Boşluğu doldur',tr:'İngilizceye çevir',ord:'Kelimeleri sıraya diz',lis:'Dinle ve yaz'}[q.k]+(q.re?' · tekrar':'');let body;
  const Q=`<div class="qq">${esc(q.q).replace('___','<u class="gapu"></u>')}</div>`,inp=ph=>`<input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${ph}" onkeydown="if(event.key=='Enter')lAns()"><button class="btn" onclick="lAns()">Kontrol et</button>`;
  const sol=`<div class="ex"><div><b>${esc(q.k=='mc'?'':q.a[0])}</b>${q.k!='mc'&&q.a.length>1?`<span>ya da: ${esc(q.a.slice(1).join(' · '))}</span>`:''}</div>${q.k=='mc'||q.k=='gap'?'':spk(q.a[0])}</div>`;
  if(q.k=='mc')body=Q+q.o.map((o,k)=>`<button class="opt ${!l.rev?'':k==q.a?'good':k==l.sel?'bad':''}" onclick="lAns(${k})">${esc(o)}</button>`).join('');
  else if(q.k=='ord'){const used=new Set(l.pick);body=Q+`<div class="slots ${l.rev?(l.ok?'ok':'no'):''}">${l.pick.map((i,k)=>`<button class="tile" onclick="lUn(${k})">${esc(l.tok[i])}</button>`).join('')||'<span class="ph">Kelimelere sırayla dokun</span>'}</div>${l.rev?'':`<div class="pool">${l.pool.map(i=>`<button class="tile" ${used.has(i)?'disabled':''} onclick="lPick(${i})">${esc(l.tok[i])}</button>`).join('')}</div>`}`}
  else if(q.k=='lis')body=`<div class="center"><button class="spk xl" data-say="${esc(q.a[0])}">🔊</button></div>`+(l.rev?'':inp('Duyduğunu yaz…')+`<button class="btn ghost" onclick="lSkip()">Sesi duyamıyorum, bu soruyu geç</button>`);
  else body=Q+(l.rev?'':inp('Cevabını yaz…'));
  const ver=!l.rev?'':`<div class="verdict ${l.ok?'good':'bad'}">${l.ok?l.praise+(l.combo>=3?` 🔥 ${l.combo}'lü seri`:''):(q.k=='mc'?'Olmadı.':'Senin cevabın: '+esc(l.ans||'—'))+(q.re?'':' Bu soru sonda bir kez daha gelecek.')}</div>${q.k=='mc'?'':sol}<div class="box teal"><small>NEDEN</small>${q.w||''}</div><button class="btn" onclick="lNext()">Devam →</button>`;
  return top+`<div class="card"><span class="tag">${lab}</span>${body}${ver}</div>`}

/* ---------- Lab ---------- */
function gen(s,v,o,t,m){const he=s=='He'||s=='She',sg=he||s=='I',be=s=='I'?'am':he?'is':'are';
  const sl=s=='I'?'I':s.toLowerCase(),[b,s3,p,pp,ing]=v;let aux,main;
  switch(t){case 0:aux=he?'does':'do';main=b;break;case 1:aux=be;main=ing;break;case 2:aux='did';main=b;break;case 3:aux=sg?'was':'were';main=ing;break;
    case 4:aux='will';main=b;break;case 5:aux=be;main='going to '+b;break;case 6:aux=he?'has':'have';main=pp;break;default:aux='can';main=b}
  if(m==0){if(t==0)return `${s} ${he?s3:b} ${o}.`;if(t==2)return `${s} ${p} ${o}.`;return `${s} ${aux} ${main} ${o}.`}
  if(m==1)return `${s} ${aux=='can'?'cannot':aux+' not'} ${main} ${o}.`;
  return `${aux[0].toUpperCase()+aux.slice(1)} ${sl} ${main} ${o}?`}
function newOp(){const s=SUBJ[rnd(6)],vo=VERBS[rnd(VERBS.length)],o=vo[1][rnd(vo[1].length)];let t,m;do{t=rnd(8);m=rnd(3)}while(t==0&&m==0);
  V.op={base:gen(s,vo[0],o,0,0),t,m,sol:gen(s,vo[0],o,t,m),rev:false};render()}
function chkOp(){const o=V.op;o.ans=document.getElementById('ans').value;o.ok=normS(o.ans)==normS(o.sol);o.rev=true;S.op[1]++;if(o.ok)S.op[0]++;S.log[today()]=(S.log[today()]||0)+1;save();render();if(o.ok)say(o.sol)}
function newAf(){const a=AFFIX[rnd(AFFIX.length)],x=a.x[rnd(a.x.length)],opts=new Set([x[1]]);
  while(opts.size<4){const b=AFFIX[rnd(AFFIX.length)];opts.add(b.x[rnd(b.x.length)][1])}V.af={a,x,opts:shuffle([...opts]),sel:null};render()}
function pickAf(k){const f=V.af;if(f.sel!=null)return;f.sel=k;S.af[1]++;if(f.opts[k]==f.x[1])S.af[0]++;save();render()}
function labTab(i){V.lab=i;if(i==0&&!V.op)return newOp();if(i==1&&!V.af)return newAf();render()}
function vLab(){const t=V.lab||0,tabs=['Operatör','Kelime cebiri','Zipf','Unutma eğrisi'];

function sha256(str){const b=new TextEncoder().encode(str),P=[];for(let n=2;P.length<64;n++)if(P.every(p=>n%p))P.push(n);
  const K=P.map(p=>(Math.cbrt(p)%1)*4294967296|0);let H=P.slice(0,8).map(p=>(Math.sqrt(p)%1)*4294967296|0);
  const l=b.length,n=((l+9+63)>>6)<<4,w=new Uint32Array(n);for(let i=0;i<l;i++)w[i>>2]|=b[i]<<(24-(i&3)*8);w[l>>2]|=0x80<<(24-(l&3)*8);w[n-1]=l*8;w[n-2]=Math.floor(l/536870912);
  const W=new Uint32Array(64),r=(x,k)=>x>>>k|x<<(32-k);
  for(let j=0;j<n;j+=16){let[a,b2,c,d,e,f,g,h]=H;
    for(let t=0;t<64;t++){if(t<16)W[t]=w[j+t];else{const x=W[t-15],y=W[t-2];W[t]=(r(x,7)^r(x,18)^(x>>>3))+W[t-16]+(r(y,17)^r(y,19)^(y>>>10))+W[t-7]}
      const t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[t]+W[t])|0,t2=((r(a,2)^r(a,13)^r(a,22))+((a&b2)^(a&c)^(b2&c)))|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b2;b2=a;a=(t1+t2)|0}
    H=[a,b2,c,d,e,f,g,h].map((v,i)=>(v+H[i])|0)}
  return H.map(v=>(v>>>0).toString(16).padStart(8,'0')).join('')}

const tUrl=(path,st)=>T.cfg.u.replace(/\/+$/,'')+'/teams/'+encodeURIComponent(T.cfg.t+(st?'_st':''))+(path?'/'+path:'')+'.json'+(T.cfg.k?'?auth='+encodeURIComponent(T.cfg.k):'');

function setPath(o,segs,val){segs=segs.filter(Boolean);if(!segs.length)return;let cur=o;for(let i=0;i<segs.length-1;i++){if(cur[segs[i]]==null||typeof cur[segs[i]]!=='object')cur[segs[i]]={};cur=cur[segs[i]]}
  const k=segs[segs.length-1];if(val==null)delete cur[k];else cur[k]=val}
async function tWrite(method,path,val){

      if(ev.type=='put'){if(m.path=='/')T.D=m.data||{};else setPath(T.D,segs,m.data)}

      T.loaded=true;T.live=true;tChanged()};
    es.addEventListener('put',h);es.addEventListener('patch',h);

const filled=(q,a)=>q.k=='ord'?a&&a.length:a!=null&&String(a).trim()!=='';
function exSubmit(){const X=V.ex,items=X.qs.map((q,i)=>{const a=X.ans[i];let g='',ok=null,s='';

async function saveExam(){const f=V.eb;if(!(f.t||'').trim())return toast('Sınava bir ad ver.');const qs=[];
  for(const [i,q] of f.qs.entries()){if(!(q.q||'').trim())return toast((i+1)+'. sorunun metni boş.');

    else if(q.k=='open')qs.push({k:'open',q:q.q.trim()});
    else{const as=(q.as||'').split('/').map(s=>s.trim()).filter(Boolean);if(!as.length)return toast((i+1)+'. sorunun doğru cevabını yaz.');qs.push({k:q.k,q:q.q.trim(),a:as})}}
